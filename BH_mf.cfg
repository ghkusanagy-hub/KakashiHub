// Slash Diablo Maphack Configuration, v2.5.9
// Authors: M81, Dax, Labarr
// Requires BH>=1.9.9 (planqi branch)
// Note: 1.9.9-b10 no longer supported. Must have the full 1.9.9 release!

// Recommendations:
// * Item Detailed Notifications on
// * Filter Level 2
// * Ping Level
//     - "Pings are for high-end items only": Ping level 3
//     - "Pings are for useful stuff I might want": Ping level 4 or 5
//     - Ladder reset: Ping level 6

// Filter levels
// 0: Filter nothing
// 1: Filter many white and blue items, but several exceptions made (e.g., blood glove bases). Notify on flawless amythests and rals.
// 2: Same as 1 but no notifications for flawless amythests and rals.
// 3: Filter all white, blue, and rare items not whitelisted (DANGEROUS! Use at your own risk)

// Ping Levels
// 0, 1, 2: Ping all tier 1 and 2 (orange/purple) boxes only
// 3: Ping tiers 1, 2, 3 (red box+)
// 4: Ping tiers 1, 2, 3, 4, and selected magic and rare items (gold box+)
// 5: Ping tiers 1, 2, 3, 4, 5, and selected magic and rare items (green box+)
// 6: Ping tiers 1, 2, 3, 4, 5, 6, magic and rare items, and ladder reset stuff (gray box+)

//
// ADVANCED ITEM DISPLAY
//

// Color of map box and indicator
// Orange (0x60): Tier 1 (worth sur+)
// Purple (0x9b): Tier 2 (worth vex-Lo)
// Red (0x0a): Tier 3 (worth mal-gul or so, also very rare items with low demand)
// Gold (0x0d): Tier 4 (worth lem-um, useful items that are common, also rare items with lower demand)
// Sage (0x82) / Green (0x84): Tier 5 (very common useful items, niche use-case items)
// Gray (0xd0): Tier 6 (ladder reset tier)
// Yellow (0x0c): Reserved for unidentified rare items (e.g., claws and pelts)
// Blue (0x97): Reserved for unidentified magic items (e.g., charms and barb hats)
// White (0x20): Unused
// Dark Green (0x76): Unused
//
// The following colors only work with glide. Fall-back color in square brackets.
// Light Gray (0xd6) [Gray]: Unused
// Sage (0x82) [Green]: Tier 5 items
// Coral (0x66) [Red]: Unused
// Teal (0xcb) [Blue]: Unused

//=======================================GEMS==========================================================
// Indicators: Colour coded (eg. Purple for Amethysts)
ItemDisplay[GEMTYPE=1]: %PURPLE%%MAP%O%WHITE%%GEMLEVEL%%CONTINUE%
ItemDisplay[GEMTYPE=2]: %WHITE%%MAP%O %GEMLEVEL%%CONTINUE%
ItemDisplay[GEMTYPE=3]: %DARK_GREEN%%MAP%O %WHITE%%GEMLEVEL%%CONTINUE%
ItemDisplay[GEMTYPE=4]: %RED%%MAP%O %WHITE%%GEMLEVEL%%CONTINUE%
ItemDisplay[GEMTYPE=5]: %BLUE%%MAP%O %WHITE%%GEMLEVEL%%CONTINUE%
ItemDisplay[GEMTYPE=6]: %YELLOW%%MAP%O %WHITE%%GEMLEVEL%%CONTINUE%
ItemDisplay[GEMTYPE=7]: %LIGHT_GRAY%%MAP%O %WHITE%%GEMLEVEL%%CONTINUE%

// Ametistas Stackadas (gpvs = Perfect, gzvs = Flawless)
ItemDisplay[gpvs OR gzvs]: %PURPLE%%MAP%O %WHITE%%NAME% %CONTINUE%

// Diamantes Stackados (gpws = Perfect, gzws = Flawless)
ItemDisplay[gpws OR gzws]: %WHITE%%MAP%O %NAME% x%CONTINUE%

// Esmeraldas Stackadas (gpgs = Perfect, gzgs = Flawless)
ItemDisplay[gpgs OR gzgs]: %DARK_GREEN%%MAP%O %WHITE%%NAME% %CONTINUE%

// Rubis Stackados (gprs = Perfect, gzrs = Flawless)
ItemDisplay[gprs OR gzrs]: %RED%%MAP%O %WHITE%%NAME% %CONTINUE%

// Safiras Stackadas (gpbs = Perfect, gzbs = Flawless)
ItemDisplay[gpbs OR gzbs]: %BLUE%%MAP%O %WHITE%%NAME% %CONTINUE%

// Topázios Stackados (gpys = Perfect, gzys = Flawless)
ItemDisplay[gpys OR gzys]: %YELLOW%%MAP%O %WHITE%%NAME% %CONTINUE%

// Caveiras Stackadas (skzs = Perfect, skfs = Flawless)
ItemDisplay[skzs OR skfs]: %LIGHT_GRAY%%MAP%O %WHITE%%NAME% %CONTINUE%

