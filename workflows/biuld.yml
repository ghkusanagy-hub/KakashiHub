name: Build AHK EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Download AutoHotkey
      run: |
        Invoke-WebRequest -Uri https://www.autohotkey.com/download/ahk.zip -OutFile ahk.zip
        Expand-Archive ahk.zip -DestinationPath ahk

    - name: Compile Script
      run: |
        ahk\Compiler\Ahk2Exe.exe /in KakashiHub.ahk /out KakashiHub.exe

    - name: Upload EXE
      uses: actions/upload-artifact@v3
      with:
        name: KakashiHub
        path: KakashiHub.exe